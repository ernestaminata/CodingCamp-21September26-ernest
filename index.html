<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <!-- Storage warning banner (hidden by default) -->
    <div id="storage-warning" class="storage-warning" hidden aria-live="polite" role="alert">
      <span id="storage-warning-message"></span>
      <button type="button" id="storage-warning-dismiss" aria-label="Dismiss warning">&times;</button>
    </div>

    <div class="app-container">

      <!-- Header: Balance Display -->
      <header class="app-header">
        <h1>Expense &amp; Budget Visualizer</h1>
        <div id="balance-display" class="balance-display" aria-label="Total balance">
          $0.00
        </div>
      </header>

      <main class="app-main">

        <!-- Input Form -->
        <section class="form-section" aria-labelledby="form-heading">
          <h2 id="form-heading">Add Transaction</h2>
          <form id="transaction-form" novalidate>

            <div class="field-group">
              <label for="input-name">Item Name</label>
              <input
                type="text"
                id="input-name"
                name="name"
                maxlength="100"
                placeholder="e.g. Coffee"
                autocomplete="off"
              />
              <span class="field-error" id="error-name" aria-live="polite"></span>
            </div>

            <div class="field-group">
              <label for="input-amount">Amount ($)</label>
              <input
                type="number"
                id="input-amount"
                name="amount"
                min="0.01"
                max="999999999.99"
                step="0.01"
                placeholder="0.00"
              />
              <span class="field-error" id="error-amount" aria-live="polite"></span>
            </div>

            <div class="field-group">
              <label for="input-category">Category</label>
              <select id="input-category" name="category">
                <option value="">-- Select category --</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
              <span class="field-error" id="error-category" aria-live="polite"></span>
            </div>

            <button type="submit" class="btn-submit">Add Transaction</button>

          </form>
        </section>

        <!-- Transaction List -->
        <section class="list-section" aria-labelledby="list-heading">
          <h2 id="list-heading">Transactions</h2>
          <div id="transaction-list" class="transaction-list" role="list" aria-label="Transaction list">
            <!-- Transactions rendered here by JS; placeholder shown when empty -->
            <p id="list-placeholder" class="list-placeholder">No transactions recorded yet.</p>
          </div>
        </section>

        <!-- Pie Chart -->
        <section class="chart-section" aria-labelledby="chart-heading">
          <h2 id="chart-heading">Spending by Category</h2>
          <div id="chart-container" class="chart-container">
            <canvas id="pie-chart" aria-label="Spending distribution pie chart" role="img"></canvas>
            <!-- Chart unavailable fallback (hidden by default) -->
            <p id="chart-unavailable" class="chart-unavailable" hidden>
              Chart unavailable — could not load charting library.
            </p>
          </div>
        </section>

      </main>
    </div>

    <!-- Chart.js v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <!-- App logic -->
    <script defer src="js/app.js"></script>

  </body>
</html>
